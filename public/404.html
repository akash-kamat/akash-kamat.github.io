<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var path = location.pathname;
        var repo = "/" + (location.pathname.split("/")[1] || "");
        var pathAfterRepo = path.startsWith(repo) ? path.slice(repo.length) : path;
        var redirect = repo + "/?redirect=" + encodeURIComponent(pathAfterRepo + location.search + location.hash);
        location.replace(redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
